name: Build and Release Skin

on:
  push:
    branches: [main]
    tags: ['v*']
  # Manual re-run of a build that failed for a reason outside the repo (a flaky
  # runner, an expired token). Dispatch it on the tag to rebuild a release, or
  # on main to redeploy dist — the ref decides, same as a push.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync translations from Google Sheets
        env:
          TRANSLATIONS_URL: ${{ secrets.TRANSLATIONS_SHEET_URL }}
        run: |
          set -euo pipefail
          if [ -z "${TRANSLATIONS_URL:-}" ]; then
            echo "::warning::TRANSLATIONS_SHEET_URL secret not set — skipping translation sync, using committed file"
          else
            curl -fL "$TRANSLATIONS_URL" -o "src/ui/de1 gui translation - Sheet1.csv"
            echo "Translations synced from Google Sheets"
            echo "Languages: $(head -1 'src/ui/de1 gui translation - Sheet1.csv')"
          fi

      - name: Stage whitelist into ./dist
        run: |
          set -euo pipefail
          mkdir -p dist
          # Whitelist — ONLY these paths become part of the skin.
          # Everything else in the repo (shots/, .DS_Store, AI agent dirs,
          # loose notes, TCL files, figama_code/, test logs, etc.) is excluded
          # by construction, not by ignore rules.
          #
          # Layout note: index.html at repo root references src/css, src/modules,
          # src/profiles, src/settings, src/ui — so we ship src/ as-is, not the
          # individual subfolders.
          for path in index.html skin-manifest.json src; do
            if [ -e "$path" ]; then
              cp -r "$path" dist/
            else
              echo "::warning::whitelist entry missing: $path"
            fi
          done

      # On tag builds, rewrite the manifest version from the git tag so the
      # tag is the single source of truth. Maintainer only has to `git tag vX.Y.Z`
      # and the release zip's skin-manifest.json is auto-synced. On main pushes
      # (dist branch deploys) the manifest stays as committed.
      - name: Sync skin-manifest.json version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v' dist/skin-manifest.json > dist/skin-manifest.json.tmp
          mv dist/skin-manifest.json.tmp dist/skin-manifest.json
          echo "Synced manifest version to: $version"
          cat dist/skin-manifest.json


      # On main pushes (dist branch deploys): suffix the id so the dist build
      # installs alongside the released skin instead of clobbering it, mark the
      # name so it is obvious which one is running, and stamp a prerelease
      # version so two dist builds are tellable apart. Without the stamp every
      # dist build reports the released number, so "installed version" says
      # nothing about which build is on the tablet.
      - name: Stamp the dist manifest and the bundle version
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          base=$(jq -r '.version' dist/skin-manifest.json)
          dev="${base}-dev.$(echo "${{ github.sha }}" | cut -c1-7).${{ github.run_number }}"
          jq --arg v "$dev" '.id = "streamline.js-dist" | .name = "\(.name) Dev" | .version = $v' \
            dist/skin-manifest.json > dist/skin-manifest.json.tmp
          mv dist/skin-manifest.json.tmp dist/skin-manifest.json
          # APP_VERSION is what the RUNNING bundle reports; the manifest is what
          # the bridge reports from disk. The skin-update check compares the two,
          # so leaving this at the released number would make every dist load
          # look like a pending update.
          sed -i "s/^export const APP_VERSION = '.*';/export const APP_VERSION = '${dev}';/" dist/src/version.js
          grep -n "APP_VERSION" dist/src/version.js
          cat dist/skin-manifest.json

      - name: Validate skin-manifest.json
        run: |
          set -euo pipefail
          test -f dist/skin-manifest.json
          jq -e '.id == "streamline.js" or .id == "streamline.js-dist"' dist/skin-manifest.json > /dev/null
          jq -e '.version' dist/skin-manifest.json > /dev/null


      - name: Reject filenames with Win32 reserved chars
        run: |
          set -euo pipefail
          bad=$(find dist -type f | grep -E '[<>:"|?*]' || true)
          if [ -n "$bad" ]; then
            echo "::error::found filenames with Win32 reserved chars:"
            echo "$bad"
            exit 1
          fi

      # On every push to main: publish ./dist to the dist branch (orphan, force)
      - name: Deploy to dist branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: dist
          force_orphan: true

      # On tag push: zip ./dist and publish a GitHub Release
      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd dist
          zip -r ../streamline.js-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: streamline.js-${{ github.ref_name }}.zip
          generate_release_notes: true
